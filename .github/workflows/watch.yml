name: slunks-watch

on:
  schedule:
    # check every 5 min, but only the UTC hours that cover ~9am-9pm
    # America/Los_Angeles across both PST (UTC-8) and PDT (UTC-7).
    # check.mjs does the exact LA-time gate. This is the *check* cadence —
    # you are only notified when a product actually changes, not every run.
    # 5m = catch sudden/random drops fast; still silent unless something changes.
    - cron: "*/5 16-23 * * *" # 16:00-23:59 UTC
    - cron: "*/5 0-5 * * *" #  00:00-05:59 UTC
  workflow_dispatch: {} # manual run button (always runs; set FORCE to bypass window)

# allow the job to push snapshot.json back to the repo
permissions:
  contents: write

concurrency:
  group: slunks-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check catalog
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # manual runs bypass the time window; scheduled runs respect it
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: node check.mjs

      - name: Persist snapshot
        run: |
          git config user.name "slunks-watch[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add snapshot.json
          git commit -m "snapshot $(date -u +%FT%TZ)" || exit 0
          git push
